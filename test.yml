# GPUnit test for PiscemBuild
# Generated from planning data - threads: 2  
# Resource requirements: 16 CPU cores, 16GB memory
# NOTE: This is a single test with required parameters only - covers basic index building functionality
name: "PiscemBuild - Basic Index Building Test"
module: PiscemBuild
params:
  reference.files: "test_data/reference.fasta"
  kmer.length: "31"
  minimizer.length: "19"
  threads: "2"
  output.prefix: "piscem_index"

assertions:
  diffCmd: diff <%gpunit.diffStripTrailingCR%> -q
  files:
    "piscem_index_piscem_index.tar.gz":
      diff: "expected/piscem_index_piscem_index.tar.gz"